<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Zhipeng Hu 的个人主页。欢迎访问我的 GitHub。">
<meta name="theme-color" content="#f5f3ed">
<title>Zhipeng Hu — 个人主页</title>
<style>
:root{color-scheme:light;--paper:#f5f3ed;--ink:#202a25;--muted:#636b63;--accent:#43624b}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}a{color:inherit} .page{max-width:1440px;margin:auto;min-height:100svh;padding:36px 6vw;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ccd0c5;padding-bottom:24px}.logo{text-decoration:none;font-size:20px;font-weight:700;letter-spacing:-1px}.nav{text-decoration:none;font-size:13px;display:flex;gap:12px;align-items:center}.nav:hover{text-decoration:underline}main{flex:1;display:grid;grid-template-columns:1.2fr 1fr;align-items:center;gap:6vw;padding:84px 0}.eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;display:flex;align-items:center;gap:12px}.dot{height:7px;width:7px;background:var(--accent);border-radius:50%}h1{font-size:clamp(64px,8.5vw,128px);line-height:1.02;letter-spacing:-.065em;font-weight:500;margin:30px 0}h1 span{font-family:Georgia,serif;font-style:italic;color:var(--accent)}.intro{font-size:16px;line-height:1.9;color:var(--muted);margin:0 0 36px}.cta{display:inline-flex;align-items:center;justify-content:space-between;gap:48px;background:var(--ink);color:white;padding:19px 24px;border-radius:4px;text-decoration:none;font-size:14px;transition:background .2s,transform .2s}.cta:hover{background:var(--accent);transform:translateY(-2px)}a:focus-visible{outline:3px solid #ad702d;outline-offset:6px}.art{aspect-ratio:1;position:relative;display:grid;place-items:center;border:1px solid #d7d9ce;border-radius:50%;background:radial-gradient(circle,#e2e8d9 0,transparent 68%)}.art:before,.art:after{content:"";position:absolute;border:1px solid #c1caba;border-radius:50%;inset:12%}.art:after{inset:27%}.asterisk{font-family:Georgia,serif;font-size:clamp(150px,25vw,350px);color:var(--accent);line-height:1;transform:translateY(15%);z-index:1}.orbit{position:absolute;top:14%;right:14%;width:14px;height:14px;border-radius:50%;background:#9c5c38}.art-label{position:absolute;bottom:8%;font-family:monospace;font-size:10px;letter-spacing:2px;color:var(--muted)}footer{border-top:1px solid #ccd0c5;padding-top:22px;display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:11px;letter-spacing:.5px}.footer-label{text-transform:uppercase}
@media(max-width:700px){.page{padding:25px 7vw}main{grid-template-columns:1fr;padding:55px 0 40px;gap:44px}h1{font-size:76px}.art{width:70%;max-width:300px;justify-self:center}.asterisk{font-size:200px}.intro{font-size:14px}footer{font-size:10px}.cta{padding:17px 22px}}
@media(prefers-reduced-motion:reduce){.cta{transition:none}.cta:hover{transform:none}}
</style>
</head>
<body>
<div class="page">
<header><a class="logo" href="./" aria-label="主页">Zhipeng Hu<span aria-hidden="true">.</span></a><a class="nav" href="https://github.com/huzp22">GitHub <span aria-hidden="true">↗</span></a></header>
<main><section aria-labelledby="title"><div class="eyebrow"><span class="dot" aria-hidden="true"></span>Personal website</div><h1 id="title">Hello,<br>I'm <span>Zhipeng<br>Hu.</span></h1><p class="intro">欢迎来到我的个人主页。<br>更多内容，正在慢慢生长。</p><a class="cta" href="https://github.com/huzp22">访问我的 GitHub <span aria-hidden="true">↗</span></a></section><div class="art" aria-hidden="true"><span class="asterisk">✳</span><span class="orbit"></span><span class="art-label">A LITTLE SPACE ON THE WEB</span></div></main>
<footer><span>© Zhipeng Hu</span><span class="footer-label">A work in progress.</span></footer>
</div>
</body>
</html>
